stages:
  - build

build-docs:
  stage: build
  tags:
    - build_docs
  image: $CI_REGISTRY/ci/images/idf-v5.5-docs:1
  before_script:
    - python -m pip install --disable-pip-version-check -r docs/requirements.txt
  script:
    - cd docs
    - build-docs -l en build
    - 'echo "Documentation preview: ${CI_JOB_URL}/artifacts/file/docs/_build/en/generic/html/index.html"'
  artifacts:
    when: always
    paths:
      - docs/_build/en/generic/html/
      - docs/_build/en/generic/sphinx-build-output-html.txt
    expire_in: 1 week
  rules:
    - changes:
        - docs/**/*
        - examples/**/*.rst
        - .gitlab-ci.yml
